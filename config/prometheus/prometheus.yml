global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'fcim-ai-chatbot'

scrape_configs:
  - job_name: 'fcim-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
